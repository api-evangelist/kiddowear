name: KiddoWear
description: >-
  KiddoWear (now operating as Kiddo Health) is a pediatric healthcare technology
  company that offers a connected care platform for capturing and sharing health
  data for children with physical and behavioral health challenges. The platform
  combines biometric tracking of 12+ biomarkers (respiration, heart rate, stress
  scores, and sleep), family journaling of behavior and health status between
  visits, educational family resources, care navigation that integrates with
  medical records and clinical workflows, and a provider dashboard that surfaces
  insights and real-time health trends. Kiddo Health serves behavioral health
  conditions such as ADHD and autism spectrum disorder and metabolic conditions
  such as childhood obesity and diabetes, bridging gaps between families,
  providers, and care teams across health plans, health systems, and employers.
  A Techstars-backed portfolio company added to the API Evangelist network. As of
  this profile the company publishes no public developer API, documentation, or
  SDKs.
